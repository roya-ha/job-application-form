<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="header">
        <h1>Job Application Form</h1>
        <p>Teacher · Part-time · Kabul</p>
    </header>
    <main class="main-container">
        <section class="intro">
            <h2>Submit your application</h2>
            <p>The following is required and will only be shared with admin.</p>
        </section>
        <form class="application-form" action="" method="get">
            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input type="text" id="fullname" name="fullname" placeholder="Enter your full name" required>
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" placeholder="Enter your email address" required>
            </div>
            <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter your phone number" required> 
            </div>
            <div class="form-group">
                <label for="date">Date of Birth</label>
                <input type="date" id="date" name="date" required>
            </div>
            <div class="form-group">
                <label>Gender</label>
                <div class="gender-options">
                    <label class="radio-label">
                    <input type="radio"  name="gender" value="female" required>
                    Female</label>       
                    <label class="radio-label">
                    <input type="radio" name="gender" value="male">
                    Male</label>
                </div>
            </div>
            <div class="form-group">
                <label for="job">Job Position</label>
                <select id="job" name="job" required>
                    <option value="english-teacher">English Teacher</option>
                    <option value="math-teacher">Math Teacher</option>
                    <option value="programming-teacher">Programming Teacher</option>
                </select>
            </div>
            <div class="form-group">
                <label for="experience">Years of Experience</label>
                <select id="experience" name="experience" required>
                    <option value="1">1 year</option>
                    <option value="2">2 years</option>
                    <option value="3"> 3 years</option>
                    <option value="4">More than 4 years</option>
                </select>
            </div>
            <div class="form-group">
                <label>Skills</label>
                <div class="skills-container">
                    <label class="checkbox-label">
                        <input type="checkbox" name="skills" value="expert">
                    Expert</label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="skills" value="responsible">
                    Responsible</label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="skills" value="creative">
                    Creative</label>
                    <label class="checkbox-label">
                        <input type="checkbox" name="skills" value="confident">
                    Confident</label>
                </div>
            </div>
            <div class="form-group">
                <label for="resume">Resume</label>
                <input type="file" id="resume" name="resume"required>
            </div>
            <div class="form-group">
                <label for="cover-letter">Cover Letter</label>
                <textarea id="cover-letter" name="cover-letter" placeholder="Write a cover letter" rows="5" required></textarea>
            </div>
            <div class="terms">
                <label class="checkbox-label">
                    <input type="checkbox" name="terms" required>
                I agree to the terms and conditions.</label>
            </div>
            <div class="form-buttons">
                <button type="reset" class="reset-button">Reset</button>
                <button type="submit" class="submit-button">Submit</button>
            </div>
        </form>
    </main>
</body>
</html>
